<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <title>Student Confirmation</title>
  </head>
  <body>
    <h3>Student Confirmation</h3>

    The student is confirmed: <span th:text="${student.firstName} + ' ' + ${student.lastName}" />

    <br /><br />

    Grade: <span th:text="${student.grade}" />

    <br /><br />

    Postal Code: <span th:text="${student.postalCode}" />

    <br /><br />

    Course Code: <span th:text="${student.courseCode}" />

    <br /><br />

    Country: <span th:text="${student.country}" />

    <br /><br />

    Favorite Programming Language: <span th:text="${student.favLanguage}" />

    <br /><br />

    Favorite Operating Systems:

    <ul>
      <li
        th:each="tempSystem : ${student.favSystems}"
        th:text="${tempSystem}"
      />
    </ul>
  </body>
</html>
