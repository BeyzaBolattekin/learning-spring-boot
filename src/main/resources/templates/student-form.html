<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <title>Student Registration Form</title>
    <style>
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h3>Student Registration Form</h3>

    <form
      th:action="@{/processStudentForm}"
      th:object="${student}"
      method="POST"
    >
      First name:
      <input
        type="text"
        th:field="*{firstName}"
      />

      <br /><br />

      Last name (*):
      <input
        type="text"
        th:field="*{lastName}"
      />
      <span
        th:if="${#fields.hasErrors('lastName')}"
        th:errors="*{lastName}"
        class="error"
      />

      <br /><br />

      Grade:
      <input
        type="number"
        th:field="*{grade}"
      />
      <span
        th:if="${#fields.hasErrors('grade')}"
        th:errors="*{grade}"
        class="error"
      />

      <br /><br />

      Postal Code:
      <input
        type="number"
        th:field="*{postalCode}"
      />
      <span
        th:if="${#fields.hasErrors('postalCode')}"
        th:errors="*{postalCode}"
        class="error"
      />

      <br /><br />

      Course Code:
      <input
        type="text"
        th:field="*{courseCode}"
      />
      <span
        th:if="${#fields.hasErrors('courseCode')}"
        th:errors="*{courseCode}"
        class="error"
      />

      <br /><br />

      Country:

      <select th:field="*{country}">
        <option
          th:each="tempCountry : ${countries}"
          th:value="${tempCountry}"
          th:text="${tempCountry }"
        />
      </select>

      <br /><br />

      Favorite Programming Language:

      <input
        type="radio"
        th:field="*{favLanguage}"
        th:each="tempLang : ${languages}"
        th:value="${tempLang}"
        th:text="${tempLang}"
      />

      <br /><br />

      Favorite Operation Systems:

      <input
        type="checkbox"
        th:field="*{favSystems}"
        th:each="tempSystem : ${systems}"
        th:value="${tempSystem}"
        th:text="${tempSystem}"
      />

      <br /><br />

      <input
        type="submit"
        value="Submit"
      />
    </form>
  </body>
</html>
